[package]
name = "rayconf"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5.51", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["socks"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
anyhow = "1.0.102"
url = { version = "2.5.8", features = ["serde"] }
percent-encoding = "2.3.2"
base64 = "0.22.1"
urlencoding = "2.1.3"
http = "1.4.0"
querystring = "1.1.0"
tokio = { version = "1.48.0", features = ["full"] }
dnsclient = "0.2.0"
futures = "0.3.32"
rand = "0.10.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
