[package]
name = "rayconf"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5.51", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["stream"] }
dialoguer = "0.12.0"
anyhow = "1.0.102"
url = { version = "2.5.8", features = ["serde"] }
percent-encoding = "2.3.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
